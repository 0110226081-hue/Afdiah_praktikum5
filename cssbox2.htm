    <!-- Menghubungkan CSS -->

</head>

<body>

                <span>➡</span>
                <span>⟳</span>

                <div class="alamat">
                    http://box1b.com
                </div>
            </div>
        </div>

        <!-- KOTAK HIJAU -->
        <div class="hijau"></div>

        <!-- BAGIAN TENGAH -->
        <div class="content">

            <!-- KOLOM KIRI -->
            <div class="kiri">
                <div class="kuning"></div>
                <div class="kuning"></div>
            </div>

            <!-- KOLOM KANAN -->
            <div class="kanan">
                <div class="oranye"></div>
                <div class="biru"></div>
            </div>

        </div>

    </div>

</body>
