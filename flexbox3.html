
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Praktikum Flexbox 3</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="flexbox3.css">
</head>

<body>

    <div class="container">

        <!-- BARIS PERTAMA: 3 KOTAK -->
        <div class="baris pertama">

            <div class="kotak">1</div>
            <div class="kotak">2</div>
            <div class="kotak">3</div>

        </div>

        <!-- BARIS KEDUA: 5 KOTAK -->
        <div class="baris kedua">

            <div class="kotak">4</div>
            <div class="kotak">5</div>
            <div class="kotak">6</div>
            <div class="kotak">7</div>
            <div class="kotak">8</div>

        </div>

    </div>

</body>
</html>
