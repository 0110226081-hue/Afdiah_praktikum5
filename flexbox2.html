
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Implementasi Layout FlexBox 2</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="flexbox2.css">
</head>

<body>

    <div class="container">

        <!-- BAGIAN HEADER -->
        <header class="header">
            Header
        </header>

        <!-- BAGIAN TENGAH -->
        <main class="content">

            <!-- ARTICLE -->
            <article class="article">
                Article
            </article>

            <!-- ASIDE -->
            <aside class="aside">
                Aside
            </aside>

            <!-- NAV -->
            <nav class="nav">
                Nav
            </nav>

        </main>

        <!-- BAGIAN FOOTER -->
        <footer class="footer">
            Footer
        </footer>

    </div>

</body>
</html>
