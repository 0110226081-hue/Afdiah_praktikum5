
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum CSS Box</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="box.css">
</head>

<body>

    <div class="browser">

        <!-- Bagian atas browser -->
        <div class="browser-header">
            <div class="browser-title">Mozilla</div>

            <div class="address-bar">
                <span>⬅</span>
                <span>➡</span>
                <span>⟳</span>
                <div class="address">
                    http://box1.com
                </div>
            </div>
        </div>

        <!-- Bagian isi -->
        <div class="container">

            <div class="box box1"></div>

            <div class="box box2"></div>

            <div class="box box3"></div>

            <div class="box box4"></div>

        </div>

    </div>

</body>
</html>
