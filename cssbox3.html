<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Praktikum CSS Box 3</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="box2.css">
</head>

<body>

    <div class="browser">

        <!-- HEADER BROWSER -->
        <div class="header">
            <div class="judul">Mozilla</div>

            <div class="address-bar">
                <span>⬅</span>
                <span>➡</span>
                <span>⟳</span>

                <div class="alamat">
                    http://box2.com
                </div>
            </div>
        </div>

        <!-- BARIS ATAS -->
        <div class="baris-atas">
            <div class="kuning"></div>
            <div class="oranye"></div>
        </div>

        <!-- BAGIAN TENGAH -->
        <div class="bagian-tengah">

            <div class="hijau"></div>

            <div class="abu-abu"></div>

            <div class="biru-muda"></div>

        </div>

        <!-- BAGIAN BAWAH -->
        <div class="biru-tua"></div>

    </div>

</body>
</html>
