
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Praktikum Flexbox 5</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="flexbox5.css">
</head>

<body>

    <main class="halaman">

        <!-- LAYOUT PERTAMA (A) -->
        <section class="layout-a">

            <nav class="nav-a">
                Nav
            </nav>

            <div class="bagian-kanan">

                <header class="header-a">
                    Header
                </header>

                <div class="content-a">

                    <article class="article-a">
                        Article
                    </article>

                    <aside class="aside-a">
                        Aside
                    </aside>

                </div>

                <footer class="footer-a">
                    Footer
                </footer>

            </div>

        </section>


        <!-- LAYOUT KEDUA (B) -->
        <section class="layout-b">

            <header class="header-b">
                Header
            </header>

            <div class="content-b">

                <aside class="aside-b">
                    Aside
                </aside>

                <article class="article-b">

                    <div class="images">

                        <div class="image-box">
                            Image
                        </div>

                        <div class="image-box">
                            Image
                        </div>

                        <div class="image-box">
                            Image
                        </div>

                    </div>

                    <span>Article</span>

                </article>

            </div>

            <footer class="footer-b">
                Footer
            </footer>

        </section>

    </main>

</body>
</html>
